services:
  photoview:
    image: photoview/photoview:2.4.0
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      photoview-prepare:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    environment:
      - PHOTOVIEW_DATABASE_DRIVER=mysql
      - PHOTOVIEW_MYSQL_URL=photoview:${PHOTOVIEW_DB_PASSWORD}@tcp(mariadb:3306)/photoview
      - PHOTOVIEW_LISTEN_IP=0.0.0.0
      - PHOTOVIEW_MEDIA_CACHE=/home/photoview/media-cache
    volumes:
      - ${APP_DATA_DIR}/storage:/home/photoview/media-cache
      # Photo library, on the USB drive mounted at /pcloud-backup on the host.
      - /pcloud-backup/Photos:/photos:ro
    x-runtipi:
      is_main: true
      internal_port: 80

  # One-shot helper that hands the media cache folder to the photoview user (uid/gid 999).
  # Docker creates the bind-mounted host directory as root, which the photoview process
  # could otherwise not write thumbnails and transcoded videos into.
  photoview-prepare:
    image: photoview/photoview:2.4.0
    restart: "no"
    network_mode: "none"
    user: root
    entrypoint: []
    command: /bin/bash -c "sleep 1 && chown -R photoview:photoview /home/photoview/media-cache"
    cap_add:
      - CHOWN
    volumes:
      - ${APP_DATA_DIR}/storage:/home/photoview/media-cache

  mariadb:
    image: mariadb:lts
    restart: unless-stopped
    stop_grace_period: 5s
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    command: mariadbd --innodb-buffer-pool-size=512M --transaction-isolation=READ-COMMITTED --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-connections=512 --innodb-rollback-on-timeout=OFF --innodb-lock-wait-timeout=120
    environment:
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_DATABASE=photoview
      - MARIADB_USER=photoview
      - MARIADB_PASSWORD=${PHOTOVIEW_DB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${PHOTOVIEW_DB_ROOT_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 1m
      timeout: 5s
      retries: 5
      start_period: 3m

x-runtipi:
  schema_version: 2
