services:
  invio:
    image: ghcr.io/kittendevv/invio:latest
    restart: unless-stopped
    environment:
      - ADMIN_USER=${INVIO_ADMIN_USER}
      - ADMIN_PASS=${INVIO_ADMIN_PASS}
      - JWT_SECRET=${INVIO_JWT_SECRET}
      - DATABASE_PATH=/app/data/invio.db
      - ORIGIN=http://localhost:8542
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    x-runtipi:
      is_main: true
      internal_port: 8000

x-runtipi:
  schema_version: 2
